      - {id: SKEL, text: "Godot 工程骨架（project.godot、scenes、scripts、resources）", status: written-unverified, note: "从未在 Godot 中打开"}
      - {id: RES, text: "雪庇护所调研 research/SNOW_SHELTER_RESEARCH.md", status: done, note: "基于网页检索摘要，原始出处未逐条核验"}

