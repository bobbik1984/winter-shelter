      - {id: T0.3, text: "F5 冒烟测试（含 T0.3-prep 截图工具）", status: todo, depends: [T0.1, T0.2], note: "T0.3-prep 已写 tools/capture_snapshot.gd 并窗口试跑成功；F5 冒烟与探针读数（坡上 2.15 m / 平地 0.65 m）待人工 + verifier"}
      - {id: T0.4, text: "D1–D11 决策入档", status: blocked, note: "D1(修订)/D2/D3/D5/D8/D9 已入档；D4/D6/D7/D10/D11 待拍板"}
