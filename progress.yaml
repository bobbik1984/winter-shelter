# progress.yaml — 机器可读进度投影（派生自 CURRENT_STAGE.md 与已验收证据）
# 状态取值：todo | written-unverified | done | blocked | superseded（被新决策替代，不再执行）
# 规则：只有证据齐全才写 done（见 AGENTS.md §5）；任务 ID 与 PRODUCTION_PLAN.md §4 一致。
project:
  name: Winter Shelter (Snow Shelter Challenge)
  code: wild
  version: "0.2-alpha"
  status: dev
  tech: [Godot 4.3 stable, GDScript, Tilt-shift perspective (ortho fallback), SunModel real solar arc, NightSimulator 6-axis]
  current_milestone: "M2 Playable：完整循环已可玩（scripted 验证）→ 等 PT02 试玩与 M3"
  branch: "claude/visual-pass-1（未合并、未推送）"
  blocker: "人工 F5 试玩（V1 / T0.3）与 PT01/PT02 试玩；分支未合并"
  updated: "2026-11-01"
  playable: "简报（含最好记录）→ 探测 / 采集 / 建造（4 路线 + 顶厚 / 通风选项）/ 生火融雪 → 入夜（雪洞小场景）→ 6 维报告 → 重开；目标行；野外手册 [H]；罗盘太阳；失温倒下；暂停；头灯；降雪；Blender 角色；天气多样性；进洞视图；中英双语 [L]；手柄；静音 / 全屏"

