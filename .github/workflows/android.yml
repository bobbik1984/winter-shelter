# 安卓测试包（2026-11-07）：Godot 4.3 导出未签名的 arm64 APK，再用和其它项目同一把发布密钥签名，上传为 Actions 产物。
# 同一把密钥签名，所以新包可以直接覆盖安装旧包（存档保留）。
# 需要仓库 Secrets：ANDROID_KEYSTORE_BASE64（PKCS12 密钥库的 base64）、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS。
name: Android APK
on:
  workflow_dispatch:
    inputs:
      test_key:
        description: "Sign with a throwaway key (pipeline check only: it can't update an install signed with the real key)"
        type: boolean
        default: false
  push:
    branches: ["claude/visual-pass-1", "main"]
    paths-ignore: ["**.md", "playtests/**", "snapshots/**", "tools/blender/**"]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.3"
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require persistent signing configuration
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "${{ inputs.test_key }}" = "true" ]; then echo "test key run"; exit 0; fi
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD" && test -n "$SIGNING_ALIAS" || { echo "Android signing secrets are missing on this repository; refusing to build a randomly signed APK."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-android-v1
      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # 只留安卓模板
          unzip -q tpl.tpz "templates/android_*" "templates/version.txt" && rm tpl.tpz
      - name: Install templates and editor settings
        run: |
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir" && cp ~/godot/templates/* "$tdir/"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
      - name: Import and export unsigned APK
        run: |
          echo "${GITHUB_SHA::7}-android" > build_info.txt
          mkdir -p build/android
          ~/godot/godot --headless --path . --import > import.txt 2>&1 || true
          ~/godot/godot --headless --path . --export-release "Android" build/android/unsigned.apk 2>&1 | tee export.txt
          test -s build/android/unsigned.apk || { echo "export failed"; tail -50 import.txt; exit 1; }
          ls -la build/android
      - name: Align and sign with the persistent key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/signing.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          out="build/android/winter-shelter-${GITHUB_SHA::7}.apk"
          if [ "${{ inputs.test_key }}" = "true" ]; then
            SIGNING_ALIAS=test SIGNING_PASSWORD=testtest
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -alias test -storepass testtest -keypass testtest -dname "CN=Throwaway test key" -keyalg RSA -keysize 2048 -validity 30 >/dev/null
            out="build/android/winter-shelter-${GITHUB_SHA::7}-TESTKEY.apk"
          else
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"
          fi
          "$BT/zipalign" -f -p 4 build/android/unsigned.apk build/android/aligned.apk
          export SIGNING_PASSWORD
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$SIGNING_ALIAS" --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out "$out" build/android/aligned.apk
          "$BT/apksigner" verify --print-certs "$out" | grep -E "Signer #1 certificate (DN|SHA-256)"
          "$BT/aapt" dump badging "$out" | grep -E "^package|sdkVersion|native-code|application-label:"
          rm build/android/unsigned.apk build/android/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: winter-shelter-apk-${{ github.sha }}
          path: build/android/*.apk
          retention-days: 30
